<!DOCTYPE html><html lang="es"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Mapa Campus UTA</title>
<link rel="stylesheet" href="/css/app.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
body,html{margin:0;padding:0}
#map{width:100%;height:calc(100vh - 120px);min-height:500px;}
.map-root{position:relative;}
/* Toolbar flotante arriba del mapa */
.map-toolbar{
  position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:1000;
  display:flex;gap:6px;background:rgba(13,17,23,.95);backdrop-filter:blur(12px);
  border:1px solid #30363d;border-radius:40px;padding:6px 12px;
  box-shadow:0 4px 24px rgba(0,0,0,.6);
}
.tool-btn{
  display:flex;align-items:center;gap:5px;padding:6px 14px;border-radius:24px;
  font-size:.78rem;font-weight:600;cursor:pointer;border:none;
  background:transparent;color:#8b949e;transition:.15s;white-space:nowrap;
}
.tool-btn:hover{background:rgba(255,255,255,.08);color:#e6edf3;}
.tool-btn.active{background:#1d4ed8;color:#fff;box-shadow:0 0 12px rgba(29,78,216,.5);}
.tool-btn.active-green{background:#15803d;color:#fff;box-shadow:0 0 12px rgba(21,128,61,.5);}
.tool-sep{width:1px;background:#30363d;margin:4px 2px;}
/* Popup de edición integrado al mapa */
.map-popup-form{
  position:absolute;z-index:2000;
  background:#0d1117;border:1px solid #30363d;border-radius:12px;
  padding:14px;width:240px;box-shadow:0 8px 32px rgba(0,0,0,.7);
  display:none;
}
.map-popup-form.show{display:block;}
.map-popup-form h4{margin:0 0 10px;font-size:.82rem;color:#60a5fa;display:flex;justify-content:space-between;align-items:center;}
.map-popup-form input,.map-popup-form select{
  width:100%;box-sizing:border-box;background:#161b22;border:1px solid #30363d;
  color:#e6edf3;border-radius:6px;padding:6px 8px;font-size:.76rem;margin-bottom:7px;
}
.map-popup-form .row{display:flex;gap:5px;}
.map-popup-form label{font-size:.7rem;color:#8b949e;display:block;margin-bottom:3px;}
.map-popup-form .check-row{display:flex;align-items:center;gap:6px;margin-bottom:8px;font-size:.74rem;color:#e6edf3;}
/* Panel lateral derecho para listas */
.side-panel{
  position:absolute;top:10px;right:10px;z-index:1000;width:260px;
  background:rgba(13,17,23,.95);backdrop-filter:blur(12px);
  border:1px solid #30363d;border-radius:12px;overflow:hidden;
  box-shadow:0 4px 24px rgba(0,0,0,.6);display:none;
}
.side-panel.show{display:block;}
.side-panel-header{padding:10px 14px;border-bottom:1px solid #30363d;font-size:.8rem;font-weight:700;color:#60a5fa;display:flex;justify-content:space-between;align-items:center;}
.side-panel-body{max-height:420px;overflow-y:auto;padding:6px;}
.node-item{
  display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:8px;
  cursor:pointer;transition:.15s;margin-bottom:3px;border:1px solid transparent;
}
.node-item:hover{background:rgba(255,255,255,.05);border-color:#30363d;}
.node-item.selected-a{border-color:#22c55e;background:rgba(34,197,94,.1);}
.node-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.node-name{font-size:.75rem;flex:1;color:#e6edf3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.node-del{background:none;border:none;color:#6e7681;cursor:pointer;font-size:.75rem;padding:2px 4px;border-radius:4px;}
.node-del:hover{color:#ef4444;background:rgba(239,68,68,.1);}
/* Hint bar */
.hint-bar{
  position:absolute;bottom:36px;left:50%;transform:translateX(-50%);z-index:1000;
  background:rgba(13,17,23,.92);border:1px solid #30363d;border-radius:24px;
  padding:6px 16px;font-size:.74rem;color:#8b949e;white-space:nowrap;
  pointer-events:none;
}
/* Route panel */
.route-panel{
  position:absolute;top:10px;left:10px;z-index:1000;width:230px;
  background:rgba(13,17,23,.95);backdrop-filter:blur(12px);
  border:1px solid #30363d;border-radius:12px;padding:12px;
  box-shadow:0 4px 24px rgba(0,0,0,.6);display:none;
}
.route-panel.show{display:block;}
.route-panel h4{font-size:.78rem;font-weight:700;color:#60a5fa;margin:0 0 8px;}
.route-panel select{width:100%;box-sizing:border-box;background:#161b22;border:1px solid #30363d;color:#e6edf3;border-radius:6px;padding:5px 7px;font-size:.74rem;margin-bottom:6px;}
.route-result{margin-top:8px;padding:7px;background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.3);border-radius:8px;font-size:.72rem;display:none;}
.leaflet-popup-content-wrapper{background:#1c2333;border:1px solid #30363d;color:#e6edf3;border-radius:10px;}
.leaflet-popup-tip{background:#1c2333;}
.leaflet-popup-content{margin:8px 12px;font-size:.78rem;}
</style>
</head><body>
<div class="app-layout">
<aside class="sidebar" id="sidebar"></aside>
<div class="main-content">
<div class="topbar">
  <div class="topbar-title">🗺️ Mapa Campus UTA</div>
  <div class="topbar-actions" id="topbar-actions"></div>
</div>
<div class="page" style="padding:0;position:relative;">
<div class="map-root">

<!-- TOOLBAR FLOTANTE -->
<div class="map-toolbar" id="toolbar">
  <button class="tool-btn" id="tb-nav" onclick="setMode('nav')" title="Navegar/calcular ruta">🗺️ Navegar</button>
  <div class="tool-sep"></div>
  <span id="admin-tools" style="display:none;gap:6px;align-items:center">
    <button class="tool-btn" id="tb-add" onclick="setMode('add')" title="Clic en el mapa para agregar punto">📍 Agregar punto</button>
    <button class="tool-btn" id="tb-connect" onclick="setMode('connect')" title="Clic en dos puntos para conectar">🔗 Conectar</button>
    <button class="tool-btn" id="tb-list" onclick="toggleList()" title="Ver lista de puntos">☰ Lista</button>
  </span>
</div>

<!-- HINT BAR -->
<div class="hint-bar" id="hint">Selecciona un modo en la barra superior</div>

<!-- FORMULARIO INLINE (aparece junto al pin) -->
<div class="map-popup-form" id="node-form">
  <h4>📍 Nuevo punto <button onclick="cancelAdd()" style="background:none;border:none;color:#6e7681;cursor:pointer;font-size:.8rem">✕</button></h4>
  <label>Nombre</label>
  <input id="f-nombre" placeholder="Ej: Rectorado UTA" autofocus>
  <label>Tipo</label>
  <select id="f-tipo" onchange="updateTipoCheck()">
    <option value="edificio">🏢 Edificio</option>
    <option value="waypoint">📌 Waypoint (intersección)</option>
    <option value="entrada">🚪 Entrada</option>
  </select>
  <label>Descripción (opcional)</label>
  <input id="f-desc" placeholder="Descripción breve...">
  <div class="check-row">
    <input type="checkbox" id="f-edificio" checked style="width:14px;height:14px">
    <label for="f-edificio" style="margin:0;font-size:.74rem;color:#e6edf3">Aparece en Dijkstra</label>
  </div>
  <div style="font-size:.68rem;color:#4b5563;margin-bottom:8px">📍 <span id="f-coords"></span></div>
  <div class="row">
    <button onclick="saveNode()" class="btn btn-primary btn-sm" style="flex:1;justify-content:center;font-size:.74rem">💾 Guardar</button>
    <button onclick="cancelAdd()" class="btn btn-ghost btn-sm" style="font-size:.74rem">✕</button>
  </div>
</div>

<!-- PANEL LATERAL — lista de nodos -->
<div class="side-panel" id="side-panel">
  <div class="side-panel-header">
    📋 Puntos (<span id="node-count">0</span>)
    <button onclick="toggleList()" style="background:none;border:none;color:#6e7681;cursor:pointer">✕</button>
  </div>
  <div class="side-panel-body" id="node-list"></div>
  <div style="border-top:1px solid #30363d;padding:8px 10px;font-size:.7rem;color:#8b949e">
    Conexiones: <strong id="conn-count">0</strong>
  </div>
</div>

<!-- ROUTE PANEL -->
<div class="route-panel" id="route-panel">
  <h4>🔍 Ruta Dijkstra</h4>
  <label style="font-size:.7rem;color:#8b949e">Origen</label>
  <select id="r-origen"></select>
  <label style="font-size:.7rem;color:#8b949e">Destino</label>
  <select id="r-destino"></select>
  <button onclick="calcRuta()" class="btn btn-primary btn-sm" style="width:100%;justify-content:center;font-size:.74rem">Calcular</button>
  <button onclick="clearRuta()" class="btn btn-ghost btn-sm" style="width:100%;justify-content:center;font-size:.72rem;margin-top:4px">Limpiar</button>
  <div class="route-result" id="route-result">
    <div style="display:flex;justify-content:space-between;margin-bottom:4px">
      <strong style="color:#22c55e">✅ Ruta óptima</strong>
      <span id="r-dist" style="color:#86efac;font-weight:700"></span>
    </div>
    <div id="r-steps" style="color:#8b949e;font-size:.7rem;line-height:1.6"></div>
  </div>
</div>

<div id="map"></div>
</div>
</div></div></div>
<div id="toast-container"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="/js/api.js"></script>
<script>
requireAuth();
renderSidebar('campus.html');

const user = api.getUser();
const isAdmin = user?.rol === 'admin';

// Centro UTA Huachi — Ambato, Ecuador (verificado en OSM)
const CENTER = [-1.2650, -78.6270], ZOOM = 17;

const map = L.map('map',{center:CENTER,zoom:ZOOM,zoomControl:false});
L.control.zoom({position:'bottomright'}).addTo(map);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
  attribution:'&copy; <a href="https://www.openstreetmap.org/copyright" style="color:#60a5fa">OpenStreetMap</a>',maxZoom:20
}).addTo(map);

// ── Estado ───────────────────────────────────────────────────
let mode='nav';          // nav | add | connect
let nodes={};            // id -> {data, marker}
let edges=[];            // {id, line}
let connectA=null;       // primer nodo en modo connect
let pendingLL=null;      // latlng del clic pendiente
let tempMarker=null;     // pin gris mientras llena form
let routeLines=[], routeMarkers=[];

// ── Mostrar panel admin ──────────────────────────────────────
if(isAdmin){
  document.getElementById('admin-tools').style.display='flex';
} else {
  // Seguridad extra: asegurar que no-admin NUNCA vea las herramientas de edición
  document.getElementById('admin-tools').style.display='none';
  document.getElementById('admin-tools').remove();
}

// ── Helpers de íconos ────────────────────────────────────────
function nodeIcon(tipo, esEd, glow=false){
  const c={edificio:'#3b82f6',waypoint:'#22c55e',entrada:'#f59e0b'}[tipo]||'#3b82f6';
  const sz=esEd||tipo==='entrada'?34:12;
  const g=glow?`box-shadow:0 0 14px ${c},0 0 4px #fff;transform:scale(1.15);`:'';
  const inner=sz>20?`<div style="font-size:.6rem;line-height:1">${tipo==='entrada'?'🚪':'🏢'}</div>`:'';
  return L.divIcon({className:'',iconSize:[sz,sz],iconAnchor:[sz/2,sz/2],popupAnchor:[0,-sz/2-4],
    html:`<div style="width:${sz}px;height:${sz}px;background:${c};border-radius:50%;border:2px solid rgba(255,255,255,.55);${g}display:flex;align-items:center;justify-content:center;cursor:pointer">${inner}</div>`});
}

function tempIcon(){
  return L.divIcon({className:'',iconSize:[28,28],iconAnchor:[14,14],
    html:`<div style="width:28px;height:28px;background:#f59e0b;border-radius:50%;border:3px solid #fff;opacity:.85;animation:none"></div>`});
}

// ── Cargar grafo ─────────────────────────────────────────────
async function loadAll(){
  const [rN,rC]=await Promise.all([api.get('/campus/puntos'),api.get('/campus/conexiones')]);
  // Limpiar mapa
  Object.values(nodes).forEach(n=>map.removeLayer(n.marker));
  edges.forEach(e=>map.removeLayer(e.line));
  nodes={}; edges=[];

  (rN?.data||[]).forEach(addNodeToMap);
  (rC?.data||[]).forEach(addEdgeToMap);
  updateSelects();
  updateCounts(rN?.data?.length||0, rC?.data?.length||0);
}

function addNodeToMap(d){
  const m=L.marker([d.y,d.x],{icon:nodeIcon(d.tipo,d.es_edificio)})
    .addTo(map);

  m.on('click',e=>{
    if(mode==='connect'){ handleConnectClick(d.id,d,e); return; }
    // En cualquier otro modo: popup con info + acciones admin
    const adminBtns=isAdmin?`
      <div style="display:flex;gap:5px;margin-top:8px">
        <button onclick="startRelocate(${d.id})" style="flex:1;padding:4px 6px;background:#1d4ed8;color:#fff;border:none;border-radius:6px;font-size:.7rem;cursor:pointer">📍 Mover</button>
        <button onclick="confirmDelNode(${d.id},'${d.nombre.replace(/'/g,"\\'")}')"
          style="flex:1;padding:4px 6px;background:#dc2626;color:#fff;border:none;border-radius:6px;font-size:.7rem;cursor:pointer">🗑 Eliminar</button>
      </div>`:'';
    m.bindPopup(`
      <div style="min-width:160px">
        <div style="font-weight:700;font-size:.85rem;margin-bottom:2px">${d.nombre}</div>
        <div style="font-size:.7rem;color:#60a5fa;text-transform:uppercase">${d.tipo}</div>
        ${d.descripcion?`<div style="font-size:.72rem;color:#8b949e;margin-top:3px">${d.descripcion}</div>`:''}
        <div style="font-size:.68rem;color:#4b5563;margin-top:4px">📍 ${(+d.y).toFixed(5)}, ${(+d.x).toFixed(5)}</div>
        ${adminBtns}
      </div>`,{maxWidth:220}).openPopup();
  });
  nodes[d.id]={data:d,marker:m};
}

function addEdgeToMap(c){
  const o=nodes[c.origen_id]?.data, d=nodes[c.destino_id]?.data;
  if(!o||!d)return;
  const l=L.polyline([[o.y,o.x],[d.y,d.x]],{
    color:'rgba(59,130,246,.4)',weight:5,dashArray:'6 4'
  }).addTo(map);
  if(isAdmin){
    l.on('click',function(e){
      L.DomEvent.stopPropagation(e);
      const mid=[(o.y+d.y)/2,(o.x+d.x)/2];
      L.popup({maxWidth:220})
        .setLatLng(mid)
        .setContent(`
          <div style="min-width:150px">
            <div style="font-weight:700;font-size:.8rem;margin-bottom:4px">🛤️ Conexión</div>
            <div style="font-size:.72rem;color:#e6edf3">${o.nombre} → ${d.nombre}</div>
            <div style="font-size:.7rem;color:#8b949e;margin:3px 0">${Math.round(c.distancia)} m · ${c.tipo_camino||'peatonal'}</div>
            <button onclick="confirmDelEdge(${c.id},'${o.nombre.replace(/'/g,"\\'")}',' ${d.nombre.replace(/'/g,"\\'")}')"
              style="width:100%;padding:5px;background:#dc2626;color:#fff;border:none;border-radius:6px;font-size:.72rem;cursor:pointer;margin-top:4px">🗑 Eliminar conexión</button>
          </div>`)
        .openOn(map);
    });
    l.on('mouseover',()=>l.setStyle({color:'rgba(59,130,246,.8)',weight:6}));
    l.on('mouseout', ()=>l.setStyle({color:'rgba(59,130,246,.4)',weight:5}));
  }
  edges.push({id:c.id,line:l});
}

// ── Modo ─────────────────────────────────────────────────────
function setMode(m){
  mode=m; connectA=null;
  cancelAdd();
  clearHighlights();
  // Resetear botones
  ['tb-nav','tb-add','tb-connect'].forEach(id=>{
    const el=document.getElementById(id);
    if(el){el.className='tool-btn';}
  });
  const hints={
    nav:'🗺️ Navegar — Clic en un marcador para ver info y eliminarlo · Clic en una línea para eliminar la conexión',
    add:'📍 Haz clic en cualquier punto del mapa real para agregar un edificio o waypoint',
    connect:'🔗 Haz clic en el PRIMER nodo, luego en el SEGUNDO para crear una conexión',
    relocate:'📍 Haz clic en la nueva ubicación del punto... (Esc para cancelar)'
  };
  document.getElementById('hint').textContent=hints[m]||'';

  // Estilo del botón activo
  const activeId={nav:'tb-nav',add:'tb-add',connect:'tb-connect'}[m];
  if(activeId){
    const el=document.getElementById(activeId);
    if(el){el.className='tool-btn active';}
  }

  // Mostrar/ocultar panel de ruta
  document.getElementById('route-panel').className='route-panel'+(m==='nav'?' show':'');
}

// ── Clic en mapa ─────────────────────────────────────────────
map.on('click',function(e){
  if(mode!=='add'||!isAdmin)return;
  pendingLL=e.latlng;
  if(tempMarker)map.removeLayer(tempMarker);
  tempMarker=L.marker([e.latlng.lat,e.latlng.lng],{icon:tempIcon(),zIndexOffset:500}).addTo(map);

  // Posicionar formulario sobre el punto en pantalla
  const pt=map.latLngToContainerPoint(e.latlng);
  const mapEl=document.getElementById('map');
  const form=document.getElementById('node-form');
  form.style.display='block';
  // Colocar el form a la derecha del pin si cabe, si no a la izquierda
  let left=pt.x+20, top=pt.y-60;
  if(left+250>mapEl.clientWidth) left=pt.x-260;
  if(top<0)top=10;
  if(top+280>mapEl.clientHeight) top=mapEl.clientHeight-290;
  form.style.left=left+'px';
  form.style.top=top+'px';
  document.getElementById('f-coords').textContent=e.latlng.lat.toFixed(6)+', '+e.latlng.lng.toFixed(6);
  document.getElementById('f-nombre').value='';
  document.getElementById('f-desc').value='';
  document.getElementById('f-nombre').focus();
});

function cancelAdd(){
  document.getElementById('node-form').style.display='none';
  if(tempMarker){map.removeLayer(tempMarker);tempMarker=null;}
  pendingLL=null;
}

function updateTipoCheck(){
  const t=document.getElementById('f-tipo').value;
  document.getElementById('f-edificio').checked=(t==='edificio'||t==='entrada');
}

async function saveNode(){
  const nombre=document.getElementById('f-nombre').value.trim();
  if(!nombre){toast('El nombre es obligatorio','error');return;}
  if(!pendingLL){toast('Haz clic en el mapa primero','error');return;}
  const body={nombre,tipo:document.getElementById('f-tipo').value,
    x:pendingLL.lng,y:pendingLL.lat,
    es_edificio:document.getElementById('f-edificio').checked,
    descripcion:document.getElementById('f-desc').value.trim()};
  const r=await api.post('/campus/puntos',body);
  if(!r?.ok){toast('Error guardando','error');return;}
  cancelAdd();
  await loadAll();
  toast('✅ '+nombre+' agregado al mapa','success');
}

// ── Conectar nodos ────────────────────────────────────────────
function handleConnectClick(id,data,e){
  L.DomEvent.stopPropagation(e);
  if(!connectA){
    connectA={id,data};
    nodes[id].marker.setIcon(nodeIcon(data.tipo,data.es_edificio,true));
    document.getElementById('hint').textContent='🔗 Nodo A: "'+data.nombre+'" — Ahora haz clic en el nodo destino';
  } else if(connectA.id===id){
    toast('Selecciona un nodo diferente','error');
  } else {
    doConnect(connectA,{id,data});
    clearHighlights();
    connectA=null;
    document.getElementById('hint').textContent='🔗 Conexión creada — Puedes seguir conectando nodos';
  }
}

async function doConnect(a,b){
  const dist=haversine(a.data.y,a.data.x,b.data.y,b.data.x);
  const r=await api.post('/campus/conexiones',{origen_id:a.id,destino_id:b.id,distancia:dist,tipo_camino:'peatonal'});
  if(!r?.ok){toast('Error creando conexión','error');return;}
  await loadAll();
  toast('✅ Conexión: '+a.data.nombre+' → '+b.data.nombre+' ('+Math.round(dist)+' m)','success');
}

function clearHighlights(){
  Object.values(nodes).forEach(n=>n.marker.setIcon(nodeIcon(n.data.tipo,n.data.es_edificio)));
}

function haversine(la1,lo1,la2,lo2){
  const R=6371000,r=Math.PI/180;
  const dLa=(la2-la1)*r,dLo=(lo2-lo1)*r;
  const a=Math.sin(dLa/2)**2+Math.cos(la1*r)*Math.cos(la2*r)*Math.sin(dLo/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

// ── Dijkstra ─────────────────────────────────────────────────
function updateSelects(){
  const pts=Object.values(nodes).filter(n=>n.data.es_edificio||n.data.tipo==='entrada');
  const opts=pts.map(n=>`<option value="${n.data.id}">${n.data.nombre}</option>`).join('');
  document.getElementById('r-origen').innerHTML=opts;
  document.getElementById('r-destino').innerHTML=opts;
  if(pts.length>1) document.getElementById('r-destino').selectedIndex=1;
}

async function calcRuta(){
  const o=+document.getElementById('r-origen').value;
  const d=+document.getElementById('r-destino').value;
  if(!o||!d||o===d){toast('Selecciona origen y destino distintos','error');return;}
  clearRuta();
  const r=await api.post('/campus/ruta',{origen_id:o,destino_id:d});
  if(!r?.ok||!r.data.ok){toast(r?.data?.error||'Sin ruta disponible','error');return;}
  const ruta=r.data.ruta, dist=r.data.distancia_total;
  const ll=ruta.map(n=>[n.y,n.x]);
  const rl=L.polyline(ll,{color:'#22c55e',weight:5,opacity:.92,lineJoin:'round'}).addTo(map);
  routeLines.push(rl);
  ruta.forEach((n,i)=>{
    const isF=i===0,isL=i===ruta.length-1;
    const sz=isF||isL?20:8;
    const ic=L.divIcon({className:'',iconSize:[sz,sz],iconAnchor:[sz/2,sz/2],
      html:`<div style="width:${sz}px;height:${sz}px;background:${isF?'#f59e0b':isL?'#ef4444':'#22c55e'};border-radius:50%;border:2px solid #fff;box-shadow:0 0 6px rgba(0,0,0,.5)"></div>`});
    routeMarkers.push(L.marker([n.y,n.x],{icon:ic,zIndexOffset:1000}).bindTooltip(n.nombre,{direction:'top'}).addTo(map));
  });
  map.fitBounds(rl.getBounds(),{padding:[40,40]});
  document.getElementById('route-result').style.display='block';
  document.getElementById('r-dist').textContent=Math.round(dist)+' m';
  document.getElementById('r-steps').innerHTML=ruta.map(n=>'→ '+n.nombre).join('<br>');
  toast('Ruta: '+Math.round(dist)+' m','success');
}

function clearRuta(){
  routeLines.forEach(l=>map.removeLayer(l));routeLines=[];
  routeMarkers.forEach(m=>map.removeLayer(m));routeMarkers=[];
  document.getElementById('route-result').style.display='none';
}

// ── Lista panel ──────────────────────────────────────────────
function toggleList(){
  const p=document.getElementById('side-panel');
  const show=!p.classList.contains('show');
  p.className='side-panel'+(show?' show':'');
  if(show) renderList();
}

function renderList(){
  const ns=Object.values(nodes);
  document.getElementById('node-count').textContent=ns.length;
  document.getElementById('node-list').innerHTML=ns.map(n=>{
    const c={edificio:'#3b82f6',waypoint:'#22c55e',entrada:'#f59e0b'}[n.data.tipo]||'#3b82f6';
    return `<div class="node-item" onclick="flyTo(${n.data.id})">
      <div class="node-dot" style="background:${c}"></div>
      <span class="node-name" title="${n.data.nombre}">${n.data.nombre}</span>
      ${isAdmin?`<button class="node-del" onclick="delNode(event,${n.data.id},'${n.data.nombre.replace(/'/g,"\\'")}')" title="Eliminar">🗑</button>`:''}
    </div>`;
  }).join('')||'<div style="padding:10px;color:#6e7681;font-size:.75rem;text-align:center">No hay puntos aún</div>';
}

function flyTo(id){const n=nodes[id];if(n)map.flyTo([n.data.y,n.data.x],19,{duration:.8});}

// Llamado desde popup del marcador
async function confirmDelNode(id,name){
  map.closePopup();
  const rc=await api.get(`/campus/puntos/${id}/conexiones`);
  const cnt=rc?.data?.count||0;
  const msg=cnt>0
    ?`⚠️ "${name}" tiene ${cnt} conexión(es) que también se eliminarán.\n¿Continuar?`
    :`¿Eliminar "${name}"?`;
  if(!confirm(msg))return;
  const r=await api.delete(`/campus/puntos/${id}`);
  if(!r?.ok){toast('Error eliminando','error');return;}
  toast('🗑️ Eliminado: '+name,'success');
  await loadAll();
  renderList();
}

// Alias para la lista lateral
async function delNode(ev,id,name){
  ev.stopPropagation();
  await confirmDelNode(id,name);
}

// Eliminar conexión desde popup de línea
async function confirmDelEdge(id,nombreA,nombreB){
  map.closePopup();
  if(!confirm(`¿Eliminar conexión ${nombreA}→${nombreB}?`))return;
  const r=await api.delete(`/campus/conexiones/${id}`);
  if(!r?.ok){toast('Error eliminando conexión','error');return;}
  toast('🗑️ Conexión eliminada','success');
  await loadAll();
  renderList();
}

// Mover nodo: activa modo 'relocate' con el id pendiente
let relocateId=null;
function startRelocate(id){
  map.closePopup();
  relocateId=id;
  const name=nodes[id]?.data?.nombre||'nodo';
  document.getElementById('hint').textContent=`📍 Clic en el nuevo punto del mapa para mover "${name}"... (Esc para cancelar)`;
  setMode('relocate');
}
map.on('click',async function(e){
  if(mode!=='relocate'||!relocateId)return;
  const n=nodes[relocateId];
  if(!n)return;
  const r=await api.put(`/campus/puntos/${relocateId}`,{
    ...n.data, x:e.latlng.lng, y:e.latlng.lat
  });
  if(!r?.ok){toast('Error moviendo','error');return;}
  toast('✅ "'+n.data.nombre+'" movido','success');
  relocateId=null;
  await loadAll();
  setMode('nav');
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&mode==='relocate'){relocateId=null;setMode('nav');}
});

function updateCounts(n,c){
  document.getElementById('node-count').textContent=n;
  document.getElementById('conn-count').textContent=c;
  const el=document.getElementById('node-list');
  if(el&&document.getElementById('side-panel').classList.contains('show')) renderList();
}

// ── Buscador Nominatim en topbar ─────────────────────────────
document.getElementById('topbar-actions').innerHTML=`
  <div style="display:flex;gap:6px;align-items:center">
    <input id="srch" class="form-control" style="width:220px;font-size:.78rem;padding:5px 10px" placeholder="🔎 Buscar lugar...">
    <button class="btn btn-ghost btn-sm" onclick="buscar()">Buscar</button>
    <button class="btn btn-ghost btn-sm" onclick="map.setView(CENTER,ZOOM)">🎯 UTA</button>
  </div>`;

async function buscar(){
  const q=document.getElementById('srch').value.trim();
  if(!q)return;
  const r=await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q)}&limit=1`,{headers:{'Accept-Language':'es'}});
  const d=await r.json();
  if(!d.length){toast('No encontrado','error');return;}
  map.flyTo([+d[0].lat,+d[0].lon],18,{duration:1});
  toast('📍 '+d[0].display_name.substring(0,60),'success');
}

document.getElementById('srch')?.addEventListener('keydown',e=>{if(e.key==='Enter')buscar();});

window.addEventListener('resize',()=>map.invalidateSize());
setMode('nav');
loadAll();
</script></body></html>
