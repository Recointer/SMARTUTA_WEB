<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Reportes — SmartCampus UTA</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div class="app-layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main-content">
    <div class="topbar">
      <div class="topbar-title">📊 Reportes y Estadísticas</div>
      <div class="topbar-actions">
        <button onclick="loadAll()" class="btn btn-ghost btn-sm">🔄 Actualizar</button>
      </div>
    </div>
    <div class="page">
      <div class="stats-grid" id="stats-generales"></div>
      <div class="grid-2 mt-24">
        <div class="card">
          <div class="card-header"><span class="card-title">🎫 Turnos por tipo</span></div>
          <div id="reporte-turnos"></div>
        </div>
        <div class="card">
          <div class="card-header"><span class="card-title">📋 Trámites por estado</span></div>
          <div id="reporte-tramites"></div>
        </div>
      </div>
    </div>
  </div>
</div>
<div id="toast-container"></div>
<script src="/js/api.js"></script>
<script>
  requireAuth();
  renderSidebar('reportes.html');

  function renderBar(items, labelKey, valueKey, color = '#3b82f6') {
    if (!items.length) return '<div class="empty-state"><p>Sin datos</p></div>';
    const max = Math.max(...items.map(i => i[valueKey]));
    return items.map(item => `
      <div style="margin-bottom:12px">
        <div style="display:flex;justify-content:space-between;font-size:.825rem;margin-bottom:4px">
          <span>${item[labelKey]}</span>
          <strong>${item[valueKey]}</strong>
        </div>
        <div style="height:8px;background:var(--bg-input);border-radius:4px;overflow:hidden">
          <div style="height:100%;width:${(item[valueKey]/max*100).toFixed(0)}%;background:${color};border-radius:4px;transition:width .5s ease"></div>
        </div>
      </div>`).join('');
  }

  async function loadAll() {
    const [genRes, turnosRes, tramitesRes] = await Promise.all([
      api.get('/reportes/generales'),
      api.get('/reportes/turnos'),
      api.get('/reportes/tramites'),
    ]);

    if (genRes?.ok) {
      const d = genRes.data;
      document.getElementById('stats-generales').innerHTML = `
        <div class="stat-card"><div class="stat-value">${d.usuarios}</div><div class="stat-label">Usuarios</div><div class="stat-icon">👤</div></div>
        <div class="stat-card green"><div class="stat-value">${d.estudiantes}</div><div class="stat-label">Estudiantes</div><div class="stat-icon">🎓</div></div>
        <div class="stat-card yellow"><div class="stat-value">${d.tramites}</div><div class="stat-label">Trámites totales</div><div class="stat-icon">📋</div></div>
        <div class="stat-card cyan"><div class="stat-value">${d.turnos_hoy}</div><div class="stat-label">Turnos hoy</div><div class="stat-icon">🎫</div></div>
        <div class="stat-card"><div class="stat-value">${d.documentos}</div><div class="stat-label">Documentos</div><div class="stat-icon">📁</div></div>`;
    }

    if (turnosRes?.ok)
      document.getElementById('reporte-turnos').innerHTML =
        renderBar(turnosRes.data, 'tipo', 'total', '#3b82f6');

    if (tramitesRes?.ok)
      document.getElementById('reporte-tramites').innerHTML =
        renderBar(tramitesRes.data, 'estado', 'total', '#22c55e');
  }

  loadAll();
</script>
</body>
</html>
